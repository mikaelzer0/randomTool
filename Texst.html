/* ===== Editor professionale ===== */
.ed{flex:1;min-height:320px;outline:none;font:var(--es,18px)/1.85 var(--ef,Literata,Georgia,serif);max-width:72ch;margin-inline:auto;width:100%;caret-color:var(--acc);padding-bottom:30px}
.ed:empty::before{content:attr(data-ph);color:var(--mut)}
.ed h1{font-size:1.9em;margin:.7em 0 .3em;line-height:1.2}.ed h2{font-size:1.4em;margin:.7em 0 .3em;line-height:1.25}
.ed p,.ed div{margin:0 0 .8em}
.ed blockquote{margin:1em 0;padding-left:1em;border-left:3px solid var(--acc);color:var(--mut);font-style:italic}
.ed ul,.ed ol{padding-left:1.4em}
.pane>.tb{display:flex;gap:2px;flex-wrap:wrap;max-width:72ch;width:100%;margin:0 auto 18px;box-sizing:border-box;position:sticky;top:0;z-index:2;background:var(--paper);padding:5px;border:1px solid var(--line);border-radius:12px}
.tb button{min-width:32px;border:0;background:none;border-radius:8px;padding:5px 8px;font-weight:700;color:var(--ink);cursor:pointer}
.tb button:hover{background:var(--hov)}
.pane>select.stt{align-self:flex-start;margin:0 0 14px calc((100% - min(100%,72ch))/2);border:1px solid var(--line);border-radius:10px;background:none;color:var(--ink);font-size:13px;padding:5px 8px}
.it[data-s=bozza]{--sc:#f2b134}.it[data-s=revisione]{--sc:#5aa9e6}.it[data-s=finale]{--sc:#6fae9c}
.it[data-s=bozza] span::after,.it[data-s=revisione] span::after,.it[data-s=finale] span::after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;margin-left:8px;background:var(--sc)}
#wc{display:flex;align-items:center;gap:8px;font-weight:500;color:var(--mut)}
.gp{display:inline-block;width:90px;height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.gp i{display:block;height:100%;background:linear-gradient(90deg,var(--saf),var(--acc))}
.q{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:10px;background:none;color:var(--ink);padding:10px 12px;margin:8px 0}
.bk{width:100%;height:110px;box-sizing:border-box;border:1px solid var(--line);border-radius:10px;background:none;color:var(--ink);font:12px monospace;margin:8px 0;resize:vertical}
/* ===== Rifinitura: ordine ed eleganza ===== */
#bCo{order:9;margin-left:10px}
#bHe{order:8;width:30px;height:30px;padding:0;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center}
.bar{gap:14px;padding:12px 20px}
.bar .grp:last-child{gap:4px}
main::before{opacity:.26;animation-duration:12s}
main:focus-within::before{opacity:.5}
main::after{padding:1.5px;animation-duration:12s}
.pane{padding:48px 56px 20px}
.pane input.t{font-weight:500;font-size:44px;line-height:1.1}
.pane input.s{margin-bottom:18px}
.pane>.tb{padding:6px 8px;gap:1px;margin-bottom:22px;border-radius:14px;box-shadow:0 6px 20px -14px #0005;align-items:center}
.tb button{min-width:30px;padding:5px 7px;font-size:13px}
.tb button:nth-child(3),.tb button:nth-child(6),.tb button:nth-child(9),.tb button:nth-child(11){margin-right:10px}
.tb .grp{margin-left:auto;gap:3px;padding-left:10px;border-left:1px solid var(--line)}
.tb select{border:0;background:var(--hov);border-radius:8px;padding:5px 6px;font-size:12px;color:var(--ink);max-width:150px;margin:0}
.tb #fMin,.tb #fPlus{border:0;margin:0;font-weight:600}
.pane>select.stt{border-radius:999px;padding:4px 12px;font-size:12px;margin-bottom:18px}
.ed{line-height:1.9}

aside{padding:28px 16px}

/* ===== Stile Scrivener: cartelle, ispettore, scrivenings ===== */
body{grid-template-columns:272px 1fr 280px}

#insp{background:var(--paper);color:var(--ink);border:1px solid var(--line);box-shadow:none;padding:24px 18px;animation:none}

.pane>input.s,.pane>select.stt{display:none}

.s2{max-width:72ch;margin:0 auto 16px;width:100%;color:var(--mut);font:italic 14px Literata,Georgia,serif}
.sdiv{max-width:72ch;margin:30px auto 6px;width:100%;box-sizing:border-box;font:600 11px Figtree,system-ui,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--acc);border-top:1px solid var(--line);padding-top:12px;cursor:pointer}

/* ===== Vetro: monocromatico, glassmorphism, linee fluide ===== */
:root[data-skin=vetro]{color-scheme:dark;--bg:#08080a;--paper:rgba(20,20,23,.6);--glass:rgba(18,18,21,.55);--side:rgba(255,255,255,.05);--sidetx:#ececee;--ink:#f1f1f3;--mut:#9a9aa3;--line:rgba(255,255,255,.13);--card:rgba(255,255,255,.07);--acc:#ffffff;--acc2:#bdbdc4;--hov:rgba(255,255,255,.08);--saf:#ffffff;--cta:#f2f2f4;--ctat:#0b0b0d;--t1:rgba(255,255,255,.06);--t2:rgba(255,255,255,.1);--t3:rgba(255,255,255,.075);--t4:rgba(255,255,255,.12);--t5:rgba(255,255,255,.085)}
:root[data-skin=vetro] ::selection{background:#fff;color:#000}
:root[data-skin=vetro] option{background:#18181b;color:#f1f1f3}
:root[data-skin=vetro]::before{content:"";position:fixed;inset:-25%;z-index:-2;pointer-events:none;background:radial-gradient(40% 35% at 20% 25%,rgba(255,255,255,.2),transparent 70%),radial-gradient(35% 40% at 80% 20%,rgba(160,160,170,.18),transparent 70%),radial-gradient(45% 40% at 65% 85%,rgba(255,255,255,.13),transparent 70%),radial-gradient(30% 30% at 10% 90%,rgba(110,110,120,.2),transparent 70%);filter:blur(30px);animation:drift 26s ease-in-out infinite alternate}
:root[data-skin=vetro]::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:repeating-linear-gradient(115deg,transparent 0 46px,rgba(255,255,255,.05) 46px 47px);-webkit-mask:radial-gradient(75% 75% at 50% 40%,#000,transparent);mask:radial-gradient(75% 75% at 50% 40%,#000,transparent);animation:lines 40s linear infinite}
@keyframes drift{from{transform:translate3d(-3%,-2%,0) rotate(0) scale(1)}to{transform:translate3d(4%,3%,0) rotate(8deg) scale(1.12)}}
@keyframes lines{to{background-position:460px 0}}
:root[data-skin=vetro] :is(aside,main,dialog,#insp){background:linear-gradient(135deg,rgba(255,255,255,.13),rgba(255,255,255,.02) 45%,rgba(255,255,255,.06)),var(--glass);-webkit-backdrop-filter:blur(28px) saturate(140%);backdrop-filter:blur(28px) saturate(140%);border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 40px 80px -40px #000}

:root[data-skin=vetro] dialog::backdrop{background:rgba(0,0,0,.5);backdrop-filter:blur(8px)}
:root[data-skin=vetro] main::before{display:none}
:root[data-skin=vetro] main::after,:root[data-skin=vetro] dialog::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;background:conic-gradient(from var(--ang),rgba(255,255,255,.95),rgba(255,255,255,.06) 25%,rgba(255,255,255,.55) 50%,rgba(255,255,255,.04) 75%,rgba(255,255,255,.95));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spin 9s linear infinite;pointer-events:none;opacity:.9}
:root[data-skin=vetro] :is(.work,.pane,.foot,.ol){background:transparent}

:root[data-skin=vetro] .card{border:1px solid rgba(255,255,255,.16);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
:root[data-skin=vetro] .pane>.tb{background:rgba(24,24,27,.7);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-color:var(--line)}

<body>

<main>
  <div class="bar">
    <div class="grp seg"><button id="vEd" title="Modifica il testo · Alt+1">Scrivi</button><button id="vCk" title="Vedi le scene come schede · Alt+2">Bacheca</button><button id="vOu" title="Elenco con riassunto, stato e parole · Alt+3">Struttura</button>
    <button id="vSp" title="Apri un secondo documento accanto a questo">Affianca</button></div><div class="grp">
    <select id="fFont" title="Cambia carattere" aria-label="Carattere"></select><button id="fMin" title="Testo più piccolo">A−</button><button id="fPlus" title="Testo più grande">A+</button></div><span class="sp"></span><small id="wc"></small><div class="grp">
    <button id="bSn" title="Salva una copia della scena">Snapshot</button><button id="bCo" title="Unisci tutte le scene">Compila</button><button id="bBm" title="Segnalibri: scorciatoie ai punti importanti">Segnalibri</button><button id="bQr" title="Riferimento rapido: leggi un altro documento in una finestra mobile">Rif. rapido</button><button id="bTh" title="Palette di colori riposanti">Colori</button><button id="bIn" title="Riassunto, stato e note · Alt+D">Dettagli</button><button id="bFi" title="Cerca e sostituisci · Alt+T">Trova</button><button id="bPr" title="Obiettivo e backup">Progetto</button><button id="bFo" title="Nascondi tutto tranne il testo">Focus</button><button id="bHe" title="Come funziona">?</button></div>
  </div>

<script>
const KEY='scrivania-v2';
let S=null;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.docs)S={docs:[],cur:null,split:null,view:'ed',seen:1};
try{if(!localStorage.getItem(KEY)){const o=JSON.parse(localStorage.getItem('scrivania-v1'));if(o){S.theme=o.theme;S.font=o.font;S.size=o.size;S.goal=o.goal}}}catch(e){}
if(!S.skin3){S.theme='vetro';S.skin3=1}
let savedAt=null;const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S));savedAt=new Date()}catch(e){}};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const get=id=>S.docs.find(d=>d.id===id);
const cur=()=>get(S.cur);
const words=t=>(t.trim().match(/\S+/g)||[]).length;
let dragId=null,armed=null;

function add(sec,type){
  const d={id:'d'+Date.now()+Math.floor(Math.random()*99),sec,type,title:type==='doc'?'Nuova scena':type==='folder'?'Nuova cartella':type==='note'?'Nuova nota':type==='link'?'Nuovo link':'Immagine',syn:'',text:'',url:'',snaps:[],parent:parOf(sec)};
  S.docs.push(d);S.cur=d.id;save();render();toast(type==='folder'?'Cartella creata':type==='doc'?'Scena creata':'Elemento aggiunto');
}
function del(id){
  if(armed!==id){armed=id;renderSide();return}
  armed=null;const gone=new Set([id]);let ch=1;while(ch){ch=0;S.docs.forEach(d=>{if(!gone.has(d.id)&&gone.has(d.parent)){gone.add(d.id);ch=1}})}S.docs=S.docs.filter(d=>!gone.has(d.id));
  if(!get(S.split))S.split=null;
  if(!get(S.cur)){const f=S.docs[0];S.cur=f?f.id:null}
  save();render();
}
const DP={};
const kids=(sec,pid)=>S.docs.filter(d=>d.sec===sec&&(d.parent||null)===(pid||null));
function walk(sec,pid,f,dp=0){kids(sec,pid).forEach(d=>{f(d,dp);if(d.type==='folder'&&!d.closed)walk(sec,d.id,f,dp+1)})}
function flat(sec,pid){let o=[];kids(sec,pid).forEach(d=>{if(d.type==='folder')o=o.concat(flat(sec,d.id));else o.push(d)});return o}
const parOf=sec=>{const c=cur();return c&&c.sec===sec?(c.type==='folder'?c.id:c.parent||null):null};
function isIn(x,a){while(x){if(x===a)return true;x=get(x.parent)}return false}
function retag(a,sec){a.sec=sec;S.docs.forEach(d=>{if(d.parent===a.id)retag(d,sec)})}
function moveInto(id,fid){const a=get(id),f=get(fid);if(!a||!f||isIn(f,a))return;S.docs=S.docs.filter(d=>d!==a);retag(a,f.sec);a.parent=f.id;S.docs.push(a);f.closed=false;save();render();toast('Spostato in \u00ab'+f.title+'\u00bb')}
function toRoot(id,sec){const a=get(id);if(!a)return;S.docs=S.docs.filter(d=>d!==a);retag(a,sec);a.parent=null;S.docs.push(a);save();render()}
function moveBefore(id,target){
  if(id===target)return;
  const a=get(id),b=get(target);if(!a||!b)return;
  if(isIn(b,a))return;S.docs=S.docs.filter(d=>d!==a);retag(a,b.sec);a.parent=b.parent||null;
  S.docs.splice(S.docs.indexOf(b),0,a);save();render();
}
function dnd(el,id){
  el.draggable=true;
  el.ondragstart=e=>{dragId=id;e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',id)}catch(x){}};
  el.ondragover=e=>{e.preventDefault();el.classList.add('over')};
  el.ondragleave=()=>el.classList.remove('over');
  el.ondrop=e=>{e.preventDefault();el.classList.remove('over');const t=get(id),r=el.getBoundingClientRect();if(dragId){if(t&&t.type==='folder'&&e.clientY-r.top>r.height*.3)moveInto(dragId,id);else moveBefore(dragId,id)}dragId=null};
}
function renderSide(){
  const s=$('side');s.innerHTML='';
  const tip=document.createElement('div');tip.className='tip';const pid0=parOf('ms'),tg=pid0&&get(pid0)?get(pid0).title:'Manoscritto';tip.textContent='+ Scena e + Cartella aggiungono dentro \u00ab'+tg+'\u00bb. Clicca per scrivere, trascina per spostare.';s.append(tip);
  const sec=(k,name,btns)=>{
    const h=document.createElement('h3');h.innerHTML='<span>'+name+' <em>'+S.docs.filter(d=>d.sec===k).length+'</em></span>';h.ondragover=e=>e.preventDefault();h.ondrop=e=>{e.preventDefault();if(dragId)toRoot(dragId,k);dragId=null};
    const g=document.createElement('span');
    btns.forEach(([l,f])=>{const b=document.createElement('button');b.textContent=l;b.onclick=f;g.append(b)});
    h.append(g);s.append(h);
    // zona di rilascio in fondo alla sezione
    const items=[];walk(k,null,(d,dp)=>{DP[d.id]=dp;items.push(d)});
    if(!items.length){const e=document.createElement('div');e.className='empty';e.textContent=k==='ms'?'Aggiungi la prima scena.':'Nessun documento di ricerca.';s.append(e)}
    items.forEach(d=>{
      const r=document.createElement('div');r.className='it'+(d.id===S.cur?' cur':'');
      r.innerHTML='<i>'+({doc:'▤',note:'✎',link:'↗',img:'▣'}[d.type])+'</i><span>'+esc(d.title||'Senza titolo')+'</span>'+(d.type==='doc'?'<small>'+words(d.text||'')+'</small>':'');
      const x=document.createElement('button');x.textContent=armed===d.id?'Sicuro?':'×';x.title='Elimina';
      x.onclick=e=>{e.stopPropagation();del(d.id)};r.append(x);
      r.dataset.s=d.status||'';r.dataset.b=d.bm?1:0;r.dataset.t=d.type;r.dataset.c=d.closed?1:0;r.style.paddingLeft=(8+(DP[d.id]||0)*16)+'px';r.onclick=e=>{if(d.type==='folder'&&e.target.closest('i'))d.closed=!d.closed;S.cur=d.id;armed=null;save();render()};
      dnd(r,d.id);s.append(r);
    });
  };
  sec('ms','Manoscritto',[['+ Scena',()=>add('ms','doc')],['+ Cartella',()=>add('ms','folder')]]);
  sec('ric','Ricerca',[['+ Nota',()=>add('ric','note')],['+ Link',()=>add('ric','link')],['+ Foto',()=>$('file').click()]]);
  const cr=document.createElement('div');cr.className='cr';
  cr.innerHTML='<div>Creato da <a href="https://github.com/mikaelzer0" target="_blank" rel="noopener noreferrer">@mikaelzer0</a></div><div class="crl"><a href="https://it.fiverr.com/mikaelzero" target="_blank" rel="noopener noreferrer">Fiverr</a><a href="https://github.com/mikaelzer0" target="_blank" rel="noopener noreferrer">GitHub</a></div>';s.append(cr);
}
function pane(id,isSplit){
  const d=get(id),p=document.createElement('div');p.className='pane';
  if(isSplit){
    const sel=document.createElement('select');
    S.docs.forEach(x=>{const o=document.createElement('option');o.value=x.id;o.textContent=x.title||'Senza titolo';if(x.id===id)o.selected=true;sel.append(o)});
    sel.onchange=()=>{S.split=sel.value;save();renderMain()};p.append(sel);
  }
  if(!d){p.innerHTML='<div class="empty">Seleziona un documento.</div>';return p}
  p.append(crumb(d));const t=document.createElement('input');t.className='t';t.value=d.title;t.placeholder='Titolo';t.setAttribute('aria-label','Titolo');
  t.oninput=()=>{d.title=t.value;save();renderSide()};p.append(t);
  if(d.type==='doc'){
    const s=document.createElement('input');s.className='s';s.value=d.syn||'';s.placeholder='Riassunto (appare sulla bacheca)';
    s.oninput=()=>{d.syn=s.value;save()};p.append(s);
    const sl=document.createElement('select');sl.className='stt';sl.title='Stato della scena';
    [['','Senza stato'],['bozza','Bozza'],['revisione','Revisione'],['finale','Finale']].forEach(([v,l])=>{const o=document.createElement('option');o.value=v;o.textContent=l;if((d.status||'')===v)o.selected=true;sl.append(o)});
    sl.onchange=()=>{d.status=sl.value;save();renderSide()};p.append(sl);
  }
  if(d.type==='link'){
    const u=document.createElement('input');u.className='s';u.value=d.url||'';u.placeholder='https://…';
    const a=document.createElement('a');a.target='_blank';a.rel='noopener';a.textContent='Apri la pagina';a.style.color='var(--acc)';
    const sync=()=>{a.href=/^https?:\/\//.test(u.value)?u.value:'#'};
    u.oninput=()=>{d.url=u.value;sync();save()};sync();p.append(u,a);
  }
  if(d.type==='img'){const im=document.createElement('img');im.src=d.url;im.alt=d.title;p.append(im)}
  if(d.type!=='img'){
    const ta=document.createElement('div');ta.className='ed';ta.contentEditable=true;ta.spellcheck=true;
    ta.innerHTML=d.html!=null?d.html:esc(d.text||'').replace(/\n/g,'<br>');
    Object.defineProperty(ta,'value',{get:()=>ta.innerText});
    ta.onpaste=e=>{e.preventDefault();document.execCommand('insertText',false,e.clipboardData.getData('text/plain'))};
    const tb=document.createElement('div');tb.className='tb';
    [['B','bold','Grassetto'],['I','italic','Corsivo'],['U','underline','Sottolineato'],['H1','h1','Titolo'],['H2','h2','Sottotitolo'],['\u00b6','p','Testo normale'],['\u275d','quote','Citazione'],['\u2022','insertUnorderedList','Elenco puntato'],['1.','insertOrderedList','Elenco numerato'],['\u21e4','justifyLeft','Allinea a sinistra'],['\u2194','justifyCenter','Centra'],['\u21b6','undo','Annulla'],['\u21b7','redo','Ripeti']].forEach(([l,c,t])=>{
      const b=document.createElement('button');b.textContent=l;b.title=t;b.onmousedown=e=>e.preventDefault();
      b.onclick=()=>{ta.focus();if(c==='h1'||c==='h2'||c==='p')document.execCommand('formatBlock',false,c);else if(c==='quote')document.execCommand('formatBlock',false,'blockquote');else document.execCommand(c);ta.oninput()};
      tb.append(b)});
    if(!isSplit)tb.append(FG);
    ta.dataset.ph=d.type==='link'?'Appunti su questa pagina…':'Scrivi qui…';
    const st=document.createElement('div');st.className='st';
    const upd=()=>{const w=words(ta.value);st.innerHTML='<span>'+w+' parole</span><span>'+ta.value.length+' caratteri</span><span>~'+Math.max(1,Math.round(w/200))+' min di lettura</span><span class="sv">● Salvato</span>'};
    upd();
    ta.oninput=()=>{d.html=ta.innerHTML;d.text=ta.innerText;save();count();upd()};p.append(toolbar(),ta,st);
  }
  return p;
}
function corkboard(){
  const c=document.createElement('div');c.className='cork';
  const cf=cur(),pid=cf?(cf.type==='folder'?cf.id:cf.parent||null):null,items=kids(cf?cf.sec:'ms',pid);
  if(!items.length){c.innerHTML='<div class="empty">Nessuna scena sulla bacheca.</div>';return c}
  items.forEach(d=>{
    const k=document.createElement('div');k.className='card';
    k.innerHTML='<b>'+esc(d.title||'Senza titolo')+'</b>';
    const ta=document.createElement('textarea');ta.value=d.syn||'';ta.placeholder='Scrivi il riassunto…';
    ta.oninput=()=>{d.syn=ta.value;save()};
    const m=document.createElement('small');m.textContent=(d.type==='folder'?flat(d.sec,d.id).reduce((n,x)=>n+words(x.text||''),0):words(d.text||''))+' parole'+(d.status?' \u00b7 '+d.status:'');
    const o=document.createElement('button');o.textContent='Apri';o.onclick=()=>{S.cur=d.id;S.view=d.type==='folder'?'ck':'ed';save();render()};
    k.append(ta,m,o);dnd(k,d.id);c.append(k);
  });
  return c;
}
function renderMain(){
  const w=$('work');w.innerHTML='';const c0=cur();
  $('hint').textContent=S.view==='ou'?'Struttura: tutte le scene in elenco. Modifica titolo, riassunto e stato direttamente nelle righe.':S.view==='ck'?'Bacheca: ogni scheda \u00e8 una scena. Trascinale per riordinarle e scrivi il riassunto direttamente sulla scheda.':c0&&c0.type==='folder'?'Cartella aperta: vedi tutte le sue scene come un unico testo. Puoi scrivere direttamente qui.':'Scrivi nel foglio: si salva da solo. A sinistra trovi capitoli e scene, a destra (Dettagli) riassunto e note.';
  if(!S.docs.length){w.append(welcome());count();return}
  $('vEd').className=S.view==='ed'?'on':'';$('vCk').className=S.view==='ck'?'on':'';$('vOu').className=S.view==='ou'?'on':'';
  $('vSp').className=S.split?'on':'';$('vSp').style.display=S.view==='ed'?'':'none';
  if(S.view==='ou'){w.append(outliner());count();return}
  if(S.view==='ck'){w.append(corkboard());count();return}
  const cc=cur();if(cc&&cc.type==='folder'){w.append(scriv(cc));count();return}
  w.append(pane(S.cur,false));
  if(S.split)w.append(pane(S.split,true));
  count();
}
function count(){
  const cu=cur(),el=document.querySelector('.it.cur small');
  {const ft=$('foot');if(ft){const tot0=flat('ms',null).reduce((n,d)=>n+words(d.text||''),0),g0=S.goal||50000,w0=cu?(cu.type==='folder'?flat(cu.sec,cu.id).reduce((n,x)=>n+words(x.text||''),0):words(cu.text||'')):0,pc=Math.min(100,Math.round(tot0/g0*100));
    ft.innerHTML='<span>'+(cu?esc(cu.title||'Senza titolo')+': ':'')+w0.toLocaleString('it-IT')+' parole \u00b7 ~'+Math.max(1,Math.round(w0/200))+' min di lettura</span><span>Manoscritto: '+tot0.toLocaleString('it-IT')+' / '+g0.toLocaleString('it-IT')+' parole ('+pc+'%)</span><span class="sv">\u25cf Salvato '+(savedAt?savedAt.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'}):'\u2014')+'</span><span class="cr2">Creato da <a href="https://github.com/mikaelzer0" target="_blank" rel="noopener noreferrer">@mikaelzer0</a></span>';ft.style.setProperty('--p',pc+'%')}}if(el&&cu)el.textContent=words(cu.text||'');
  const is=document.getElementById('istat');if(is&&cu&&cu.type!=='folder')is.textContent=words(cu.text||'')+' parole \u00b7 '+(cu.text||'').length+' caratteri \u00b7 '+(cu.snaps||[]).length+' snapshot';
  const ms=flat('ms',null);
  const tot=ms.reduce((n,d)=>n+words(d.text||''),0),g=S.goal||50000;
  $('wc').innerHTML='<span class="gp"><i style="width:'+Math.min(100,tot/g*100)+'%"></i></span>'+tot.toLocaleString('it-IT')+' / '+g.toLocaleString('it-IT')+' parole';
}
function render(){renderSide();renderMain();renderInsp()}

$('vEd').onclick=()=>{S.view='ed';save();renderMain()};
$('vCk').onclick=()=>{S.view='ck';save();renderMain()};
$('vSp').onclick=()=>{
  if(S.split){S.split=null}
  else{const o=S.docs.find(d=>d.id!==S.cur);S.split=o?o.id:S.cur}
  save();renderMain();
};
$('file').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{add('ric','img');const d=cur();d.url=r.result;d.title=f.name;save();render()};
  r.readAsDataURL(f);e.target.value='';
};

// Snapshot
function snapUI(){
  const d=cur(),dl=$('dSn');
  if(!d||d.type==='img'){return}
  dl.innerHTML='<h3>Snapshot di «'+esc(d.title)+'»</h3><p class="empty">Salva una copia del testo prima di una modifica rischiosa. Se non funziona, ripristinala.</p>';
  const nb=document.createElement('button');nb.className='on';nb.textContent='Salva uno snapshot ora';
  nb.onclick=()=>{d.snaps.unshift({at:new Date().toLocaleString('it-IT'),html:d.html,text:d.text||'',title:d.title,syn:d.syn||''});save();snapUI()};
  dl.append(nb);
  if(!d.snaps.length){const e=document.createElement('div');e.className='empty';e.textContent='Nessuno snapshot per questo documento.';dl.append(e)}
  d.snaps.forEach((s,i)=>{
    const r=document.createElement('div');r.className='snap';
    r.innerHTML='<span>'+esc(s.at)+' · '+words(s.text)+' parole</span>';
    const a=document.createElement('button');a.textContent='Ripristina';
    a.onclick=()=>{
      d.snaps.unshift({at:new Date().toLocaleString('it-IT')+' (prima del ripristino)',html:d.html,text:d.text||'',title:d.title,syn:d.syn||''});
      const t=d.snaps.splice(i+1,1)[0];d.text=t.text;d.html=t.html;d.title=t.title;d.syn=t.syn;
      save();dl.close();render();
    };
    const b=document.createElement('button');b.textContent='Elimina';b.onclick=()=>{d.snaps.splice(i,1);save();snapUI()};
    r.append(a,b);dl.append(r);
  });
  const c=document.createElement('button');c.textContent='Chiudi';c.style.marginTop='10px';c.onclick=()=>dl.close();dl.append(c);
  if(!dl.open)dl.showModal();
}
$('bSn').onclick=snapUI;

// Caratteri
const FONTS=[['Literata (romanzo)','Literata,Georgia,serif'],['Lora (elegante)','Lora,Georgia,serif'],['EB Garamond (classico)','"EB Garamond",Garamond,serif'],['Georgia','Georgia,serif'],['Figtree (moderno)','Figtree,system-ui,sans-serif'],['Courier Prime (macchina da scrivere)','"Courier Prime","Courier New",monospace'],['Caveat (a mano)','Caveat,cursive']];
FONTS.forEach((f,i)=>{const o=document.createElement('option');o.value=i;o.textContent=f[0];$('fFont').append(o)});
const FG=$('fFont').parentNode;
function applyFont(){const r=document.documentElement.style;r.setProperty('--ef',FONTS[S.font||0][1]);r.setProperty('--es',(S.size||18)+'px');FG.firstElementChild.value=S.font||0}
$('fFont').onchange=e=>{S.font=+e.target.value;save();applyFont()};
$('fMin').onclick=()=>{S.size=Math.max(12,(S.size||18)-2);save();applyFont()};
$('fPlus').onclick=()=>{S.size=Math.min(34,(S.size||18)+2);save();applyFont()};

// Guida
function help(){
  const dl=$('dHe');

function mk(t,f,cls){const b=document.createElement('button');b.textContent=t;b.onclick=f;if(cls)b.className=cls;return b}
function replAll(a,b){
  let n=0;
  const rpl=s=>{let o='',l=s.toLowerCase(),x=a.toLowerCase(),i=0,j;while((j=l.indexOf(x,i))>=0){o+=s.slice(i,j)+b;i=j+x.length;n++}return o+s.slice(i)};
  S.docs.forEach(d=>{
    if(d.type==='img')return;
    d.text=rpl(d.text||'');const n2=n;
    if(d.html){const h=document.createElement('div');h.innerHTML=d.html;const w=document.createTreeWalker(h,NodeFilter.SHOW_TEXT);let t;while(t=w.nextNode())t.nodeValue=rpl(t.nodeValue);d.html=h.innerHTML;n=n2}
  });
  save();render();return n;
}
function trova(){
  const dl=$('dFi');dl.innerHTML='<h3>Trova nel progetto</h3>';
  const q=document.createElement('input');q.className='q';q.placeholder='Cerca una parola o una frase\u2026';
  const out=document.createElement('div');
  q.oninput=()=>{
    out.innerHTML='';const v=q.value.trim().toLowerCase();if(v.length<2)return;let n=0;
    S.docs.forEach(d=>{
      const full=d.text||'',all=((d.title||'')+'\n'+(d.syn||'')+'\n'+full).toLowerCase();
      if(all.indexOf(v)<0)return;n++;
      const j=full.toLowerCase().indexOf(v),sn=j<0?(d.syn||''):'\u2026'+full.slice(Math.max(0,j-30),j+70).replace(/\s+/g,' ')+'\u2026';
      const r=document.createElement('div');r.className='snap';r.style.cursor='pointer';
      r.innerHTML='<span><b>'+esc(d.title||'Senza titolo')+'</b><br><small>'+esc(sn)+'</small></span>';
      r.onclick=()=>{S.cur=d.id;S.view='ed';save();dl.close();render()};out.append(r)});
    if(!n)out.innerHTML='<div class="empty">Nessun risultato.</div>'};
  const rw=document.createElement('input');rw.className='q';rw.placeholder='Sostituisci con\u2026';
  const rb=mk('Sostituisci tutto',()=>{if(q.value.trim().length<2)return;const n=replAll(q.value.trim(),rw.value);rb.textContent=n+' sostituzioni';q.oninput()});
  dl.append(q,rw,rb,out,mk('Chiudi',()=>dl.close()));dl.showModal();q.focus();
}

const CO={fmt:'txt',titles:1,sep:'* * *'};
function compOut(fmt){
  fmt=fmt||CO.fmt;
  const sep=fmt==='md'?'\n\n---\n\n':fmt==='html'?'\n<hr>\n':(CO.sep?'\n\n'+CO.sep+'\n\n':'\n\n');
  const part=d=>{const t=(d.text||'').trim();
    if(fmt==='html'){const h=d.html!=null?d.html:esc(t).replace(/\n/g,'<br>');return (CO.titles?'<h2>'+esc(d.title||'')+'</h2>\n':'')+h}
    return (CO.titles?(fmt==='md'?'## ':'')+(d.title||'')+'\n\n':'')+t};
  const body=flat('ms',null).map(part).join(sep);
  return fmt==='html'?'<!DOCTYPE html><meta charset="utf-8"><title>Manoscritto</title><body>\n'+body+'\n</body>':body;
}
function compila(){
  const dl=$('dCo');
  const draw=()=>{
    const txt=compOut();dl.innerHTML='<h3>Compila il manoscritto</h3>';
    const row=document.createElement('div');row.className='cfg';
    const mkS=(lab,opts,val,cb)=>{const l=document.createElement('label');l.textContent=lab;const s=document.createElement('select');opts.forEach(([v,t])=>{const o=document.createElement('option');o.value=v;o.textContent=t;if(String(val)===v)o.selected=true;s.append(o)});s.onchange=()=>{cb(s.value);draw()};l.append(s);row.append(l)};
    mkS('Formato',[['txt','Testo semplice'],['md','Markdown'],['html','HTML']],CO.fmt,v=>CO.fmt=v);
    mkS('Titoli delle scene',[['1','Includi'],['0','Non includere']],String(CO.titles),v=>CO.titles=+v);
    mkS('Separatore',[['* * *','* * *'],['\u2014','Linea'],['','Nessuno']],CO.sep,v=>CO.sep=v);
    dl.append(row);
    const info=document.createElement('p');info.className='empty';info.textContent=flat('ms',null).length+' scene \u00b7 '+words(txt)+' parole';dl.append(info);
    const p=document.createElement('div');p.className='prev';p.textContent=txt;dl.append(p);
    const cp=mk('Copia',async()=>{try{await navigator.clipboard.writeText(txt);cp.textContent='Copiato'}catch(e){cp.textContent='Copia non disponibile'}},'on');
    const cf=mk('Copia formattato (per Word)',async()=>{try{await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([compOut('html')],{type:'text/html'}),'text/plain':new Blob([txt],{type:'text/plain'})})]);cf.textContent='Copiato: incolla in Word'}catch(e){cf.textContent='Non disponibile qui'}});
    const pr=mk('Stampa o PDF',()=>{const e=$('pr');e.style.whiteSpace='normal';e.innerHTML=compOut('html');dl.close();setTimeout(()=>window.print(),50)});
    dl.append(cp,cf,pr,mk('Chiudi',()=>dl.close()));
  };
  draw();if(!dl.open)dl.showModal();
}
$('bCo').onclick=compila;
addEventListener('keydown',e=>{if(!e.altKey||e.ctrlKey||e.metaKey)return;const m={Digit1:()=>$('vEd').click(),Digit2:()=>$('vCk').click(),Digit3:()=>$('vOu').click(),KeyN:()=>add('ms',e.shiftKey?'folder':'doc'),KeyT:()=>$('bFi').click(),KeyD:()=>$('bIn').click()}[e.code];if(m){e.preventDefault();m()}});
applyFont();applyTheme();render();
if(!S.seen){S.seen=1;save();help()}
</script>
