<!DOCTYPE html>
<html lang="it">
<head>

<title>Fluxo – editor di diagrammi</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&display=swap">
<style>
:root{--ink:#111;--bgg:linear-gradient(135deg,#fbfbfb 0%,#d6d6d6 42%,#f3f3f3 68%,#bcbcbc 100%);--ac:#111;--cv:#fff;--grid:#b5b5b5;--mut:#6b6b6b;--bd:rgba(0,0,0,.14);--gl:rgba(255,255,255,.58);--gl2:rgba(255,255,255,.3);--gb:rgba(255,255,255,.8);--sh:0 10px 34px rgba(0,0,0,.12);--pg1:rgba(255,255,255,.94);--pg2:rgba(255,255,255,.66);--pgs:rgba(0,0,0,.14);--bc1:#fff;--bc2:#000;--o1:.9;--o2:.16;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#f2f2f2;--bgg:linear-gradient(135deg,#050505 0%,#232323 45%,#0b0b0b 70%,#3a3a3a 100%);--ac:#fff;--cv:#111;--grid:#4a4a4a;--mut:#9a9a9a;--bd:rgba(255,255,255,.18);--gl:rgba(28,28,28,.55);--gl2:rgba(255,255,255,.04);--gb:rgba(255,255,255,.14);--sh:0 10px 34px rgba(0,0,0,.55);--pg1:rgba(34,34,34,.85);--pg2:rgba(18,18,18,.58);--pgs:rgba(255,255,255,.16);--bc2:#999;--o1:.14;--o2:.12;color-scheme:dark}}
:root[data-theme="dark"]{--ink:#f2f2f2;--bgg:linear-gradient(135deg,#050505 0%,#232323 45%,#0b0b0b 70%,#3a3a3a 100%);--ac:#fff;--cv:#111;--grid:#4a4a4a;--mut:#9a9a9a;--bd:rgba(255,255,255,.18);--gl:rgba(28,28,28,.55);--gl2:rgba(255,255,255,.04);--gb:rgba(255,255,255,.14);--sh:0 10px 34px rgba(0,0,0,.55);--pg1:rgba(34,34,34,.85);--pg2:rgba(18,18,18,.58);--pgs:rgba(255,255,255,.16);--bc2:#999;--o1:.14;--o2:.12;color-scheme:dark}
html,body{height:100%;margin:0}
body{background:var(--bgg);color:var(--ink);font:13px/1.45 "Manrope",system-ui,"Segoe UI",Arial,sans-serif;letter-spacing:.01em;display:flex;flex-direction:column;overflow:hidden}
#bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#bgfx svg{position:absolute;inset:0;width:100%;height:100%}
.f{stroke-width:1.4;opacity:.6;animation:sway 18s ease-in-out infinite alternate}
.f2{animation-duration:25s;animation-delay:-6s}.f3{animation-duration:21s;animation-delay:-11s}.f4{animation-duration:29s;animation-delay:-3s}
.d{stroke-width:1.2;stroke-dasharray:2 12;opacity:.8;animation:dash 40s linear infinite}
@keyframes sway{from{transform:translate(0,0)}to{transform:translate(-60px,38px)}}
@keyframes dash{to{stroke-dashoffset:-560}}
.bl{position:absolute;border-radius:50%;filter:blur(60px);animation:drift 28s ease-in-out infinite alternate}
.b1{width:55vmax;height:55vmax;left:-12vmax;top:-18vmax;background:radial-gradient(circle,var(--bc1),transparent 65%);opacity:var(--o1)}
.b2{width:50vmax;height:50vmax;right:-15vmax;bottom:-20vmax;background:radial-gradient(circle,var(--bc2),transparent 65%);opacity:var(--o2);animation-delay:-9s}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.15)}}
@media (prefers-reduced-motion:reduce){.f,.d,.bl{animation:none}}
header,#tb,footer,aside,#cv,#md>div,#fm>div{background:var(--gl);-webkit-backdrop-filter:blur(22px) saturate(160%);backdrop-filter:blur(22px) saturate(160%);border:1px solid var(--gb);box-shadow:var(--sh),inset 0 1px 0 rgba(255,255,255,.35)}
header,#tb,main,footer{position:relative;z-index:1}
header{display:flex;align-items:center;gap:8px;padding:8px 14px;margin:10px 10px 0;border-radius:16px;flex-wrap:wrap}
.logo{font-weight:600;font-size:16px;letter-spacing:.06em;margin-right:12px;display:flex;align-items:center;gap:9px}
.logo:before{content:"";width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 30% 28%,#fff,#7a7a7a 55%,#000);box-shadow:0 0 0 1px var(--bd),0 2px 8px #0004}
header .sp,footer .sp{flex:1}
button,select{font:inherit;font-weight:500;color:var(--ink);background:var(--gl);border:1px solid var(--gb);border-radius:10px;padding:5px 12px;cursor:pointer;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:background .2s,color .2s}
button:hover:not(:disabled){background:var(--ink);color:var(--cv)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
button:disabled{opacity:.35;cursor:default}
#ti{background:transparent;border:1px solid transparent;color:var(--ink);font:inherit;font-weight:500;padding:4px 10px;border-radius:10px;width:230px}
#ti:hover,#ti:focus{border-color:var(--bd);background:var(--gl2)}
#tb{display:flex;align-items:center;gap:2px;padding:4px 10px;margin:8px 10px 0;border-radius:14px;flex-wrap:wrap}
#tb button{width:32px;height:30px;padding:0;display:inline-flex;align-items:center;justify-content:center;border-color:transparent;background:transparent;box-shadow:none}
#tb button:hover:not(:disabled){background:var(--ink);color:var(--cv)}
#tb svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.vs{width:1px;height:20px;background:var(--bd);margin:0 6px}
main{flex:1;min-height:0;display:grid;grid-template-columns:176px 1fr 262px;gap:10px;padding:8px 10px}
aside{overflow:auto;padding:14px;border-radius:16px}
#pg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
#pg button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px;font-size:11px;font-weight:400;color:var(--mut);cursor:grab}
#cv{overflow:auto;position:relative;border-radius:16px;background:var(--gl2)}
#wrap{position:relative;width:max-content}
svg{display:block;touch-action:none;user-select:none}
.sh{cursor:move}
h3{margin:0 0 10px;font-size:13px;font-weight:600;letter-spacing:.04em}
label{display:block;margin:11px 0 4px;color:var(--mut);font-size:12px;font-weight:500}
.ck{display:flex;gap:6px;align-items:center;color:var(--ink);font-size:13px}
.ck input{accent-color:var(--ac)}
textarea,input[type=number],input[type=text]{width:100%;box-sizing:border-box;font:inherit;color:var(--ink);background:var(--gl2);border:1px solid var(--bd);border-radius:10px;padding:6px 9px}
.sw{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.sw i{width:22px;height:22px;border-radius:50%;border:1px solid var(--bd);cursor:pointer;box-shadow:inset 0 1px 0 #fff6}
input[type=color]{width:32px;height:26px;padding:0;border:1px solid var(--bd);border-radius:8px;background:none}
.row{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.row button{padding:4px 9px;font-size:12px}
.hint{color:var(--mut);font-size:12px}
#ed{position:absolute;resize:none;text-align:center;z-index:5;background:var(--cv);border:2px solid var(--ac);border-radius:8px}
footer{display:flex;align-items:center;gap:12px;padding:5px 14px;margin:0 10px 10px;border-radius:14px;font-size:12px;color:var(--mut)}
footer #zl{min-width:40px}#zr{width:120px;accent-color:var(--ac)}
#md,#fm{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;z-index:20}
#md>div,#fm>div{border-radius:18px;padding:18px;width:min(680px,92vw);max-height:86vh;overflow:auto}
#md textarea{height:280px;font:12px monospace}
.g4{display:grid;grid-template-columns:1fr 1fr;gap:6px}.mini{margin:0;font-size:11px}.mini input{margin-top:2px}
.chip{width:26px;height:26px;border-radius:8px;border:2px solid;cursor:pointer;box-sizing:border-box}
input[type=range]{width:100%;accent-color:var(--ac)}
@media (max-width:760px){
 body{overflow:auto}
 main{grid-template-columns:1fr;grid-template-rows:auto minmax(320px,1fr) auto}
 #pg{display:flex;overflow-x:auto}#pg button{flex:0 0 74px}
 aside#props{max-height:32vh}
}
.pri{background:var(--ink);color:var(--cv)}
.pri:hover:not(:disabled){opacity:.85}
.pj{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--bd)}
.pj b{flex:1;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pj small{color:var(--mut)}
#sb{display:flex;gap:14px}#sb b{font-weight:600;color:var(--ink)}
#ts{position:fixed;left:50%;bottom:56px;transform:translate(-50%,12px);padding:8px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:30;background:var(--gl);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:1px solid var(--gb);box-shadow:var(--sh)}
#ts.on{opacity:1;transform:translate(-50%,0)}
footer{flex-wrap:wrap}
#cr{position:relative;display:inline-flex;align-items:center;gap:12px;padding:5px 16px;border-radius:999px;color:var(--ink);font-weight:500;background:var(--gl)}
#cr::before,#cr::after{content:"";position:absolute;inset:-2px;border-radius:999px;background:linear-gradient(90deg,#ff0040,#ffea00,#00ff6a,#00d5ff,#7a00ff,#ff00c8,#ff0040);background-size:300% 100%;animation:rgbm 5s linear infinite;pointer-events:none}
#cr::before{padding:2px;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
#cr::after{z-index:-1;filter:blur(9px);opacity:.55}
#cr a{color:var(--ink);text-decoration:none;font-weight:600}#cr a:hover{text-decoration:underline}
@keyframes rgbm{to{background-position:300% 0}}
@media (prefers-reduced-motion:reduce){#cr::before,#cr::after{animation:none}}
</style>
</head>

<div id="bgfx" aria-hidden="true"><i class="bl b1"></i><i class="bl b2"></i>

<g fill="none" stroke-linecap="round"><path class="f f1" d="M-120 640C160 380 420 860 720 560S1200 240 1580 470" stroke="url(#l1)"/><path class="f f2" d="M-100 720C200 500 460 900 760 640S1240 360 1560 560" stroke="url(#l2)"/><path class="f f3" d="M-80 300C200 80 520 420 820 220S1260 60 1560 260" stroke="url(#l1)"/><path class="f f4" d="M-60 820C240 620 520 980 820 760S1300 520 1560 700" stroke="url(#l2)"/><path class="d" d="M-100 480C220 260 480 640 780 400S1220 160 1560 360" stroke="url(#l1)"/><path class="d" style="animation-direction:reverse" d="M-100 560C240 340 500 720 800 480S1240 240 1560 440" stroke="url(#l2)"/></g></svg></div>
<header>
 <span class="logo">Fluxo</span>

 <span class="sp"></span>

</main>
<footer><span id="sb"></span><span id="cr"><span>Creato da</span> <a data-nt href="https://github.com/mikaelzer0" target="_blank" rel="noopener noreferrer">@mikaelzer0</a><a data-nt href="https://it.fiverr.com/mikaelzero" target="_blank" rel="noopener noreferrer">Fiverr</a><a data-nt href="https://github.com/mikaelzer0" target="_blank" rel="noopener noreferrer">GitHub</a></span><span class="sp"></span><span id="co"></span><input id="zr" type="range" min="30" max="200" value="100" aria-label="Zoom"><span id="zl">100%</span></footer>
<div id="fm"><div><h3>File e progetti</h3>
 <div class="row" style="margin-top:0"><button id="f1" class="pri">Salva su file (.json)</button><button id="f2">Salva nella libreria</button><button id="f3">Apri da file</button><input id="fi" type="file" accept=".json,.html,application/json" hidden></div>
 <label>Esporta come</label><div class="row" id="fx" style="margin-top:0"></div>

<div id="ts" role="status"></div>

 <div class="row"><button id="m1">Mostra JSON</button><button id="m2">Mostra SVG</button><button id="m3">Carica JSON</button><button id="m4">Copia</button><button id="m5">Chiudi</button></div>
 <p class="hint" id="mh">Copia il JSON per salvare il lavoro, incollalo qui e premi Carica per riaprirlo.</p></div></div>
<script>
const W=3000,H=2000;
const IC={undo:'<path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-4"/>',redo:'<path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 000 12h4"/>',dup:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 00-2-2H6a2 2 0 00-2 2v8a2 2 0 002 2h2"/>',trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',front:'<rect x="3" y="3" width="11" height="11" rx="1"/><path d="M10 10h11v11H10z" fill="currentColor" fill-opacity=".25"/>',back:'<rect x="10" y="10" width="11" height="11" rx="1"/><path d="M3 3h11v11H3z" fill="currentColor" fill-opacity=".25"/>',zout:'<circle cx="11" cy="11" r="6"/><path d="M21 21l-5-5M8 11h6"/>',zin:'<circle cx="11" cy="11" r="6"/><path d="M21 21l-5-5M8 11h6M11 8v6"/>',fit:'<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>',new:'<path d="M6 3h8l4 4v14H6zM14 3v4h4"/>',aL:'<path d="M4 3v18M8 7h12M8 14h7"/>',aC:'<path d="M12 3v18M5 7h14M8 14h8"/>',aR:'<path d="M20 3v18M4 7h12M9 14h7"/>',aT:'<path d="M3 4h18M7 8v12M14 8v7"/>',aM:'<path d="M3 12h18M7 5v14M14 8v8"/>',aB:'<path d="M3 20h18M7 4v12M14 9v7"/>',dH:'<path d="M4 4v16M20 4v16M10 8h4v8h-4z"/>',dV:'<path d="M4 4h16M4 20h16M8 10h8v4H8z"/>'};
const TB=[['bu','undo','Annulla (Ctrl+Z)'],['br','redo','Ripeti (Ctrl+Y)'],'|',['bdup','dup','Duplica (Ctrl+D)'],['bdel','trash','Elimina (Canc)'],'|',['bfr','front','Porta in primo piano'],['bbk','back','Porta in secondo piano'],'|',['a:l','aL','Allinea a sinistra'],['a:c','aC','Centra orizzontalmente'],['a:r','aR','Allinea a destra'],['a:t','aT','Allinea in alto'],['a:m','aM','Centra verticalmente'],['a:b','aB','Allinea in basso'],['a:dh','dH','Distribuisci in orizzontale'],['a:dv','dV','Distribuisci in verticale'],'|',['bzo','zout','Riduci'],['bzi','zin','Ingrandisci'],['bf','fit','Adatta alla finestra'],'|',['bn','new','Nuovo diagramma']];
const T=[['rect','Processo',120,60],['round','Inizio/Fine',130,50],['diamond','Decisione',130,84],['para','Dati',130,60],['db','Database',90,84],['doc','Documento',120,72],['ell','Cerchio',90,90],['hex','Esagono',120,70],['tri','Triangolo',100,86],['star','Stella',100,96],['note','Nota',130,90],['text','Testo',110,30]];
const NEON=['#ffffff','#ededed','#d4d4d4','url(#gW)','#a3a3a3','url(#gS)','#404040','url(#gK)'];
const GR={'url(#gW)':'linear-gradient(135deg,#fff,#cfcfcf)','url(#gS)':'linear-gradient(135deg,#e9e9e9,#7a7a7a)','url(#gK)':'linear-gradient(135deg,#5a5a5a,#0a0a0a)'};
const STK={};NEON.forEach(c=>STK[c]='#262626');STK['url(#gK)']=STK['#404040']='#000000';
const DARK=['#000000','#262626','#404040','#737373','#a3a3a3','#d4d4d4','#ededed','#ffffff'];
const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
let S={shapes:[],conns:[],n:1,bg:'',grid:1,snap:1},sel=[],selC=null,hist=[],fut=[],zoom=1,drag=null,pu=0,svg,cp=[],cpc=[];
const snap=v=>{const g=S.gs||10;return S.snap?Math.round(v/g)*g:Math.round(v)};
const get=id=>S.shapes.find(s=>s.id===id);
const tcol=h=>{if(h[0]!='#')return h=='url(#gK)'?'#fff':'#111';const n=parseInt(h.slice(1),16);return((n>>16)*.299+((n>>8)&255)*.587+(n&255)*.114)>150?'#111':'#fff'};

function shp(t,x,y,w,h,f,s,sw,dash,rx){
 const a=`fill="${f}" stroke="${s}" stroke-width="${sw}" stroke-linejoin="round"${dash?' stroke-dasharray="8 5"':''}`;
 const P=p=>`<polygon points="${p.map(q=>q.join(',')).join(' ')}" ${a}/>`;
 if(t=='rect')return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx==null?4:rx}" ${a}/>`;
 if(t=='round')return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${h/2}" ${a}/>`;
 if(t=='diamond')return P([[x+w/2,y],[x+w,y+h/2],[x+w/2,y+h],[x,y+h/2]]);
 if(t=='para')return P([[x+w*.2,y],[x+w,y],[x+w*.8,y+h],[x,y+h]]);
 if(t=='hex')return P([[x+w*.25,y],[x+w*.75,y],[x+w,y+h/2],[x+w*.75,y+h],[x+w*.25,y+h],[x,y+h/2]]);
 if(t=='tri')return P([[x+w/2,y],[x+w,y+h],[x,y+h]]);
 if(t=='star')return P([...Array(10)].map((_,i)=>{const r=i%2?.45:1,g=(-90+36*i)*Math.PI/180;return[x+w/2+Math.cos(g)*r*w/2,y+h/2+Math.sin(g)*r*h/2]}));
 if(t=='note')return P([[x,y],[x+w,y],[x+w,y+h-16],[x+w-16,y+h],[x,y+h]]);
 if(t=='ell')return `<ellipse cx="${x+w/2}" cy="${y+h/2}" rx="${w/2}" ry="${h/2}" ${a}/>`;
 if(t=='db'){const e=Math.min(12,h/4);return `<path d="M${x},${y+e}a${w/2},${e} 0 0 1 ${w},0v${h-2*e}a${w/2},${e} 0 0 1 ${-w},0z" ${a}/><path d="M${x},${y+e}a${w/2},${e} 0 0 0 ${w},0" fill="none" stroke="${s}" stroke-width="${sw}"/>`}
 if(t=='doc')return `<path d="M${x},${y}H${x+w}V${y+h-8}Q${x+w*.75},${y+h-18} ${x+w/2},${y+h-8}T${x},${y+h-8}Z" ${a}/>`;
 return `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="transparent"/>`;
}
function txt(s){
 const L=s.text.split('\n'),fs=s.fs,cx=s.x+s.w/2,cy=s.y+s.h/2-(L.length-1)*fs*.6;
 const fl=s.tc||(s.t=='text'?'var(--ink)':tcol(s.fill));
 return `<text x="${cx}" y="${cy}" text-anchor="middle" font-size="${fs}" style="pointer-events:none;fill:${fl};font-weight:${s.fb?700:500};font-style:${s.fi?'italic':'normal'}${s.ff?';font-family:'+s.ff:''}">`+L.map((l,i)=>`<tspan x="${cx}" dy="${i?fs*1.2:0}" dominant-baseline="central">${esc(l)}</tspan>`).join('')+`</text>`;
}
function edge(s,tx,ty){
 const cx=s.x+s.w/2,cy=s.y+s.h/2,dx=tx-cx,dy=ty-cy;if(!dx&&!dy)return[cx,cy];
 const a=Math.abs(dx)/(s.w/2),b=Math.abs(dy)/(s.h/2);let k=Math.max(a,b);
 if(s.t=='diamond')k=a+b;if(s.t=='ell')k=Math.hypot(a,b);
 return[cx+dx/k,cy+dy/k];
}
function cgeo(c){
 const a=get(c.from),b=get(c.to);if(!a||!b)return;

function skip(n){return n.closest&&n.closest('#cv,#ed,textarea,script,style,svg,[data-nt]')}
function trNode(n){
 if(n.__o===undefined){const k=n.nodeValue.trim();if(!k){n.__o=null;return}n.__o=n.nodeValue;n.__k=k}
 if(n.__o===null)return;const v=TD&&TD[n.__k];n.nodeValue=v?n.__o.replace(n.__k,v):n.__o;
}
function tr(root){
 if(root.nodeType==3){if(root.parentNode&&!skip(root.parentNode))trNode(root);return}
 if(root.nodeType!=1||skip(root))return;
 const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;
 while(n=w.nextNode())if(!skip(n.parentNode))trNode(n);
 [root,...root.querySelectorAll('[title],[aria-label]')].forEach(el=>{
  if(skip(el))return;
  for(const a of['title','aria-label']){if(!el.hasAttribute(a))continue;el.__oa=el.__oa||{};if(el.__oa[a]===undefined)el.__oa[a]=el.getAttribute(a);el.setAttribute(a,(TD&&TD[el.__oa[a]])||el.__oa[a])}
 });
}

const svgDims=o=>{const m=o.match(/viewBox="([-\d.\s]+)"/)[1].trim().split(/\s+/).map(Number);return[m[2],m[3]]};
async function raster(type,q){
 const o=svgOut(),[w,h]=svgDims(o),k=2,sv=o.replace('<svg ',`<svg width="${w*k}" height="${h*k}" `);
 const img=new Image(),u=URL.createObjectURL(new Blob([sv],{type:'image/svg+xml'}));
 await new Promise((r,j)=>{img.onload=r;img.onerror=j;img.src=u});
 const c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);const x=c.getContext('2d');
 if(type!='image/png'){x.fillStyle=S.bg||'#ffffff';x.fillRect(0,0,c.width,c.height)}
 x.drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);
 return new Promise(r=>c.toBlob(r,type,q));
}
async function pdf(){
 const b=await raster('image/jpeg',.92),buf=new Uint8Array(await b.arrayBuffer()),[w,h]=svgDims(svgOut()),iw=Math.round(w*2),ih=Math.round(h*2);
 const enc=new TextEncoder(),parts=[],xr=[];let off=0;
 const add=x=>{const u=typeof x=='string'?enc.encode(x):x;parts.push(u);off+=u.length};
 const obj=(n,head,stream)=>{xr[n]=off;add(`${n} 0 obj\n${head}\n`);if(stream){add('stream\n');add(stream);add('\nendstream\n')}add('endobj\n')};
 add('%PDF-1.4\n');
 obj(1,'<</Type/Catalog/Pages 2 0 R>>');obj(2,'<</Type/Pages/Kids[3 0 R]/Count 1>>');
 obj(3,`<</Type/Page/Parent 2 0 R/MediaBox[0 0 ${w} ${h}]/Resources<</XObject<</Im0 4 0 R>>>>/Contents 5 0 R>>`);
 obj(4,`<</Type/XObject/Subtype/Image/Width ${iw}/Height ${ih}/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length ${buf.length}>>`,buf);
 const cs=`q ${w} 0 0 ${h} 0 0 cm /Im0 Do Q`;obj(5,`<</Length ${cs.length}>>`,cs);
 const x0=off;
 add('xref\n0 6\n0000000000 65535 f \n'+[1,2,3,4,5].map(n=>String(xr[n]).padStart(10,'0')+' 00000 n \n').join('')+`trailer\n<</Size 6/Root 1 0 R>>\nstartxref\n${x0}\n%%EOF`);
 return new Blob(parts,{type:'application/pdf'});
}
const htmlOut=()=>{const o=svgOut(),j=JSON.stringify(env()).replace(/</g,'\\u003c');return `<!doctype html><html lang="it"><meta charset="utf-8"><title>${esc(S.title||'Diagramma')}</title><body style="margin:0;display:grid;place-items:center;min-height:100vh;background:#f2f2f2"><div style="width:min(1200px,96vw)">${o.replace('<svg ','<svg style="width:100%;height:auto;background:#fff;border-radius:12px" ')}</div><script type="application/json" id="fluxo-data">${j}<\/script></body></html>`};
const csv=()=>{const e=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"',r=[['tipo','id','testo','x','y','larghezza','altezza','da','a','etichetta']];

function mdOut(){

 sh=s=>{const a='n'+s.id,x=q(s.text)||' ';return s.t=='diamond'?`${a}{"${x}"}`:s.t=='round'?`${a}(["${x}"])`:s.t=='ell'?`${a}(("${x}"))`:s.t=='db'?`${a}[("${x}")]`:`${a}["${x}"]`};
 const E=S.conns.map(c=>{const a=get(c.from),b=get(c.to);return a&&b?`  ${sh(a)} -->${c.text?`|${q(c.text)}|`:''} ${sh(b)}`:''}).filter(Boolean);
 const A=S.shapes.filter(s=>!S.conns.some(c=>c.from==s.id||c.to==s.id)).map(s=>'  '+sh(s));
 return `# ${S.title||_t('Diagramma')}\n\n\`\`\`mermaid\nflowchart TD\n${[...E,...A].join('\n')}\n\`\`\`\n\n| ${_t('Forme')} | x | y |\n|---|---|---|\n`+S.shapes.map(s=>`| ${q(s.text)} | ${s.x} | ${s.y} |`).join('\n')+'\n';
}
const txtOut=()=>[S.title||_t('Diagramma'),'',_t('Forme')+':',...S.shapes.map(s=>`- ${s.text.replace(/\n/g,' ')} (${s.t}, ${s.x},${s.y})`),'',_t('Collegamenti')+':',...S.conns.map(c=>{const a=get(c.from),b=get(c.to);return a&&b?`- ${a.text} -> ${b.text}${c.text?' ('+c.text+')':''}`:''}).filter(Boolean)].join('\n');
async function exportAs(ext){
 try{
  if(ext=='json')return await out('json',JSON.stringify(env(),null,2));
  if(ext=='svg')return await out('svg',svgOut());
  if(ext=='png')return await out('png',await raster('image/png'));
  if(ext=='jpg')return await out('jpg',await raster('image/jpeg',.92));
  if(ext=='webp')return await out('webp',await raster('image/webp',.92));
  if(ext=='pdf')return await out('pdf',await pdf());
  if(ext=='html')return await out('html',htmlOut());
  if(ext=='csv')return await out('csv',csv());
  if(ext=='md')return await out('md',mdOut());
  if(ext=='txt')return await out('txt',txtOut());
 }catch(e){toast('Esportazione non riuscita')}
}

 document.addEventListener('keydown',e=>{
  if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;
  const c=e.ctrlKey||e.metaKey,k=e.key.toLowerCase();
  if((k=='delete'||k=='backspace')&&(sel.length||selC)){e.preventDefault();del()}
  else if(c&&k=='z'){e.preventDefault();e.shiftKey?redo():undo()}
  else if(c&&k=='y'){e.preventDefault();redo()}
  else if(c&&k=='c'){copy()}
  else if(c&&k=='v'){e.preventDefault();paste()}
  else if(c&&k=='d'){e.preventDefault();copy();paste()}
  else if(c&&k=='a'){e.preventDefault();sel=S.shapes.map(s=>s.id);selC=null;render();props()}
  else if(k=='escape'){sel=[];selC=null;render();props()}
  else if(k.startsWith('arrow')&&sel.length){e.preventDefault();const d=e.shiftKey?1:10;push();sel.forEach(i=>{const s=get(i);if(k=='arrowleft')s.x-=d;if(k=='arrowright')s.x+=d;if(k=='arrowup')s.y-=d;if(k=='arrowdown')s.y+=d});render();save()}
 });
$('#bdup').onclick=()=>{copy();paste()};$('#bdel').onclick=del;$('#bfr').onclick=()=>order(1);$('#bbk').onclick=()=>order(0);
 $('#tb').addEventListener('click',e=>{const b=e.target.closest('[data-al]');if(b&&!b.disabled)al(b.dataset.al)});
 $('#bp').onclick=()=>{sel=[];selC=null;render();props()};
 $('#zr').oninput=e=>setZoom(e.target.value/100);$('#ti').oninput=e=>{S.title=e.target.value;save()};
 let sv=null;try{sv=localStorage.getItem('fluxo-v3')}catch(e){}
 if(sv){try{S=JSON.parse(sv)}catch(e){sv=null}}
 if(sv){render();props()}else tpl('flow');
 wire();
}
init();
</script>
</body>
</html>
